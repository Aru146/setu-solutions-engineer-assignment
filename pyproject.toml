[project]
name = "payment-reconciliation-service"
version = "1.0.0"
description = "Lightweight backend service for payment event ingestion, transaction tracking, and reconciliation reporting"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
